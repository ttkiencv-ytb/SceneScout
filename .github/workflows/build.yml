# Builds the SceneScout desktop apps on GitHub's own Mac and Windows machines.
#   - Run it by hand: Actions tab -> "Build apps" -> "Run workflow". Files appear under "Artifacts".
#   - Publish a release with a tag like v3.0.0: the apps are attached to the release automatically.
name: Build apps

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # Apple Silicon (M1, M2, M3, M4...)
            name: SceneScout-mac-apple-silicon
          - os: windows-latest
            name: SceneScout-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-app.txt

      - name: Run tests
        run: python tests/test_core.py

      - name: Build app
        run: pyinstaller SceneScout.spec --noconfirm

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          hdiutil create -volname SceneScout -srcfolder dist/SceneScout.app -ov -format UDZO "${{ matrix.name }}.dmg"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/SceneScout -DestinationPath "${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.dmg
            ${{ matrix.name }}.zip
          if-no-files-found: ignore

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.name }}.dmg
            ${{ matrix.name }}.zip
